<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph Visualization UI</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>LangGraph Visualization UI</h1>
            <div class="controls">
                <select id="graphSelect">
                    <option value="">Select a graph...</option>
                </select>
                <button id="startExecutionBtn" class="btn btn-primary">Start Execution</button>
                <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
            </div>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <div class="panel graph-panel">
                    <h2>Graph Topology</h2>
                    <div class="graph-controls">
                        <button id="zoomInBtn" class="btn btn-small">Zoom In</button>
                        <button id="zoomOutBtn" class="btn btn-small">Zoom Out</button>
                        <button id="fitBtn" class="btn btn-small">Fit</button>
                    </div>
                    <div id="cy"></div>
                </div>
            </div>

            <div class="right-panel">
                <div class="panel executions-panel">
                    <h2>Executions</h2>
                    <div id="executionsList"></div>
                </div>

                <div class="panel timeline-panel">
                    <h2>Timeline</h2>
                    <div id="timeline"></div>
                </div>

                <div class="panel logs-panel">
                    <h2>Event Logs</h2>
                    <div id="logs"></div>
                </div>

                <div class="panel approvals-panel">
                    <h2>Pending Approvals</h2>
                    <div id="approvals"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
